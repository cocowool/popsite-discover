name: Weekly Fetch RSS and Update latest_posts.json

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  fetch-and-update-latest-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install feedparser requests beautifulsoup4

      - name: Fetch RSS and Update latest_posts.json
        run: python scripts/fetch_rss.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "cocowool@github.com"
          git config --local user.name "GitHub Action"
          
          # 仅跟踪数据文件的变更 (blogs.json 的状态更新 和 latest_posts.json 的新文章)
          git add data/blogs.json data/latest_posts.json
          
          # 只有在数据发生实际变化时才 commit, 避免无意义的空提交
          git diff --staged --quiet || git commit -m "chore: weekly auto fetch rss and update data [skip ci]"
          git push